{% extends 'catalog/general.html' %}
{% load my_tags %}
{% block content %}
<div class="product-body" style="display: flex; flex-direction: column; align-items: center; gap: 20px;">
    <div class="product-image">
        {% if post.preview_image %}
            <img src="{{ post.preview_image.url }}" alt="{{ post.title }}"
                 style="width: 100%;
                        max-width: 600px;
                        height: auto;
                        max-height: 400px;
                        object-fit: contain;">
        {% endif %}
    </div>
    <div class="product-details" style="display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 600px;">
        <div>
            <div style="font-weight: 600;">Название:</div>
            <div>{{ object.title }}</div>
        </div>
        <div>
            <div style="font-weight: 600;">Описание:</div>
            <div>{{ object.content }}.</div>
        </div>
        <div>
            <div style="font-weight: 600;">Дата создания:</div>
            <div>{{ object.created_at }}</div>
        </div>
        <div>
            <div style="font-weight: 600;">Просмотров:</div>
            <div>{{ object.views_count }}</div>
        </div>
        <div>
            <a class="btn btn-sm btn-outline-secondary" href="{% url 'blog:post_list' %}">Назад</a>
        </div>
    </div>
</div>
{% endblock %}
